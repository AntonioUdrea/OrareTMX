<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orare TMX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #d6d0c4;
      --text: #1a1814;
      --muted: #7a7468;
      --accent: #000000;
      --accent-light: #f5f5f5;
      --sans: 'Roboto', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    header {
      max-width: 820px;
      margin: 0 auto 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-family: var(--sans);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    header span {
      font-family: var(--sans);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── LINE SELECTOR ── */
    .line-selector {
      max-width: 820px;
      margin: 0 auto 40px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .line-btn {
      font-family: var(--sans);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 7px 18px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .line-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .line-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .section-label {
      font-family: var(--sans);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── WEEK SCHEDULE ── */
    .week-block {
      max-width: 820px;
      margin: 0 auto 52px;
    }

    .week-meta {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }

    .week-tag {
      font-family: var(--sans);
      font-size: 0.72rem;
      background: var(--text);
      color: var(--bg);
      padding: 3px 8px;
      letter-spacing: 0.06em;
    }

    .week-dates {
      font-family: var(--sans);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--sans);
      font-size: 1rem;
    }

    .schedule-table th {
      text-align: left;
      padding: 8px 12px;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .schedule-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .schedule-table tr:last-child td {
      border-bottom: none;
    }

    .schedule-table tbody tr:hover td {
      background: var(--accent-light);
    }

    .schedule-table td:first-child {
      font-weight: 500;
      color: var(--muted);
      width: 56px;
    }

    .bus-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 600;
      padding: 2px 7px;
      letter-spacing: 0.04em;
      margin-right: 6px;
    }

    /* ── ROUTE VIEWER ── */
    .route-block {
      max-width: 820px;
      margin: 0 auto;
    }

    .dropdown-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    select {
      font-family: var(--sans);
      font-size: 0.78rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      appearance: none;
      cursor: pointer;
      outline: none;
      min-width: 160px;
    }

    select:focus {
      border-color: var(--accent);
    }

    .select-wrap {
      position: relative;
      display: inline-block;
    }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .route-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .route-table th {
      text-align: left;
      padding: 8px 12px;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      font-family: var(--sans);
    }

    .route-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-family: var(--sans);
      font-size: 0.78rem;
    }

    .route-table tbody tr:last-child td {
      border-bottom: none;
    }

    .route-table tbody tr:hover td {
      background: var(--accent-light);
    }

    .time-cell {
      font-weight: 500;
      color: var(--accent);
      width: 56px;
    }

    .route-arrow {
      color: var(--muted);
      margin: 0 6px;
      font-size: 0.7rem;
    }

    .placeholder {
      font-family: var(--sans);
      font-size: 0.78rem;
      color: var(--muted);
      padding: 20px 12px;
      border: 1px dashed var(--border);
      text-align: center;
    }

    hr.divider {
      max-width: 820px;
      margin: 0 auto 40px;
      border: none;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

    let currentLine = '1'; // default to Line 2

    // ── WEEK CALCULATION ────────────────────────────────────────────────────────

    function getMondayOfWeek(d) {
      const day = new Date(d);
      const dow = day.getDay();
      const diff = (dow === 0) ? -6 : 1 - dow;
      day.setDate(day.getDate() + diff);
      day.setHours(0, 0, 0, 0);
      return day;
    }

    function getWeekIndex(lineKey) {
      const line = LINES[lineKey];
      const refMonday = getMondayOfWeek(new Date(line.referenceMonday + 'T00:00:00'));
      const nowMonday = getMondayOfWeek(new Date());
      const diffWeeks = Math.round((nowMonday - refMonday) / (7 * 24 * 3600 * 1000));
      const refIdx = line.referenceWeekNum - 1; // 0-based
      const cycle = line.weekCycle;
      return ((refIdx + diffWeeks) % cycle + cycle) % cycle;
    }

    function formatDate(d) {
      return d.toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' });
    }

    // ── RENDER LINE BUTTONS ──────────────────────────────────────────────────────

    function renderLineSelector() {
      const container = document.getElementById('line-selector');
      container.innerHTML = '';
      Object.keys(LINES).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'line-btn' + (key === currentLine ? ' active' : '');
        btn.textContent = LINES[key].label;
        btn.onclick = () => selectLine(key);
        container.appendChild(btn);
      });
    }

    function selectLine(key) {
      currentLine = key;
      renderLineSelector();
      renderAllocation();
      // Reset schedule dropdown
      const sel = document.getElementById('schedule-select');
      sel.innerHTML = '<option value="">Selectează programul</option>';
      const line = LINES[key];
      const scheduleKeys = Object.keys(line.schedules);
      scheduleKeys.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        sel.appendChild(opt);
      });
      document.getElementById('route-view').innerHTML =
        '<div class="placeholder">Selectează un program pentru a vedea cursele.</div>';
    }

    // ── RENDER ALLOCATION ───────────────────────────────────────────────────────

    function renderAllocation() {
      const line = LINES[currentLine];
      const idx = getWeekIndex(currentLine);
      const alloc = line.allocations[idx];
      const weekNum = idx + 1;

      const now = new Date();
      const monday = getMondayOfWeek(now);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      document.getElementById('week-tag').textContent = `Săptămâna ${weekNum}`;
      document.getElementById('week-dates').textContent =
        `${formatDate(monday)} – ${formatDate(sunday)}`;
      document.getElementById('today-label').textContent =
        now.toLocaleDateString('ro-RO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      const tbody = document.getElementById('alloc-body');
      tbody.innerHTML = '';

      // All schedule keys = fixed ones + rotating ones
      const fixedKeys = Object.keys(line.fixedSchedules || {});
      const rotatingKeys = Object.keys(alloc);
      const allKeys = [...new Set([...fixedKeys, ...rotatingKeys])].sort();

      allKeys.forEach(sch => {
        const isFixed = fixedKeys.includes(sch);
        const busNum = isFixed ? line.fixedSchedules[sch] : alloc[sch];
        const tr = document.createElement('tr');
        tr.innerHTML = `
      <td>${sch}</td>
      <td><span class="bus-badge">${busNum || '—'}</span></td>`;
        tbody.appendChild(tr);
      });
    }

    // ── RENDER ROUTES ────────────────────────────────────────────────────────────

    function renderRoutes() {
      const sel = document.getElementById('schedule-select').value;
      const container = document.getElementById('route-view');
      if (!sel) {
        container.innerHTML = '<div class="placeholder">Selectează un program pentru a vedea cursele.</div>';
        return;
      }
      const routes = LINES[currentLine].schedules[sel];
      if (!routes || routes.length === 0) {
        container.innerHTML = '<div class="placeholder">Nu există curse definite pentru acest program.</div>';
        return;
      }
      let html = `<table class="route-table">
    <thead><tr><th>Ora</th><th>Cursă</th></tr></thead><tbody>`;
      routes.forEach(r => {
        html += `<tr>
      <td class="time-cell">${r.time}</td>
      <td>${r.from}<span class="route-arrow">-</span>${r.to}</td>
    </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // ── INIT ─────────────────────────────────────────────────────────────────────

    renderLineSelector();
    selectLine(currentLine);
  </script>
